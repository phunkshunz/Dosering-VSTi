name: Bygg DOSERING

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # behövs för att skapa releaser

jobs:
  # Manualen görs till PDF av Chrome och läggs i zipparna.
  manual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gör PDF-manualen
        run: |
          mkdir -p dist
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=20000 --run-all-compositor-stages-before-draw \
            --print-to-pdf="$PWD/dist/DOSERING-Manual.pdf" "file://$PWD/manual/manual.html"
          test -s dist/DOSERING-Manual.pdf

      - name: Testa motorn
        run: |
          g++ -std=c++17 -O2 -Isrc tests/engine_test.cpp -o engine_test
          ./engine_test

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: DOSERING-Manual
          path: dist/DOSERING-Manual.pdf

  macos:
    needs: manual
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Bygg
        run: cmake --build build --config Release -j 3

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: DOSERING-Manual
          path: dist/DOSERING

      - name: Paketera
        run: |
          ART=build/Dosering_artefacts/Release
          mkdir -p dist/DOSERING
          cp -R "$ART/VST3/DOSERING.vst3" dist/DOSERING/
          cp -R "$ART/AU/DOSERING.component" dist/DOSERING/
                    cp scripts/installera.command dist/DOSERING/
          chmod +x dist/DOSERING/installera.command
          for b in dist/DOSERING/DOSERING.vst3 dist/DOSERING/DOSERING.component; do
            codesign --force --deep --sign - "$b"
          done
          cd dist && ditto -c -k --keepParent DOSERING DOSERING-macOS.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: DOSERING-macOS
          path: dist/DOSERING-macOS.zip

  windows:
    needs: manual
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Bygg
        run: cmake --build build --config Release --target Dosering_VST3 -j 3

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: DOSERING-Manual
          path: dist/DOSERING

      - name: Paketera
        shell: pwsh
        run: |
          Copy-Item -Recurse "build/Dosering_artefacts/Release/VST3/DOSERING.vst3" "dist/DOSERING/"
          Compress-Archive -Path "dist/DOSERING" -DestinationPath "dist/DOSERING-Windows.zip"

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: DOSERING-Windows
          path: dist/DOSERING-Windows.zip

  linux:
    needs: manual
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installera beroenden
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev

      - name: Konfigurera
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bygg
        run: cmake --build build --config Release --target Dosering_VST3 Dosering_LV2 -j 4

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: DOSERING-Manual
          path: dist/DOSERING

      - name: Paketera
        run: |
          mkdir -p dist/DOSERING
          for t in Dosering; do
            cp -R build/${t}_artefacts/Release/VST3/*.vst3 dist/DOSERING/
            cp -R build/${t}_artefacts/Release/LV2/*.lv2 dist/DOSERING/
          done
          cp scripts/installera-linux.sh dist/DOSERING/
          chmod +x dist/DOSERING/installera-linux.sh
          cd dist && zip -r -y DOSERING-Linux.zip DOSERING

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: DOSERING-Linux
          path: dist/DOSERING-Linux.zip

  # Varje bygge på main blir en release, så att
  # .../releases/latest/download/DOSERING-macOS.zip alltid ger senaste versionen.
  release:
    if: always() && github.event_name == 'push' && needs.macos.result == 'success'
    needs: [manual, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dosering-bygge-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('DOSERING bygge {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Mac: ladda ner DOSERING-macOS.zip och installera enligt README. Windows: DOSERING-Windows.zip (VST3). Linux: DOSERING-Linux.zip (VST3 + LV2). Manualen ligger i zipparna och som PDF här."
          files: |
            dist/DOSERING-macOS.zip
            dist/DOSERING-Windows.zip
            dist/DOSERING-Linux.zip
            dist/DOSERING-Manual.pdf
